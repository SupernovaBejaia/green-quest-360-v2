# Robot « version propre » : toutes les 10 minutes, refait en HD les photos 360 arrivées dans le Drive.
name: Version propre des photos 360

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hd-bot
  cancel-in-progress: false

jobs:
  hd:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/hd_bot/requirements.txt
      - run: pip install -r tools/hd_bot/requirements.txt
      - name: Traiter la file d'attente
        env:
          GQ_BOT_URL: ${{ secrets.GQ_BOT_URL }}
          GQ_BOT_KEY: ${{ secrets.GQ_BOT_KEY }}
          PYTHONIOENCODING: utf-8
        run: python tools/hd_bot/process.py --drive --width 8192
